name: JHipster CI Build 

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-20.04 # Pin to Ubuntu 20.04 for compatibility with legacy glibc / Node 6 binaries

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Grant execute permission to the Maven wrapper
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step 4: Run full verification build
      - name: Build with Maven (Dev)
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B clean verify

      # Step 5: Package for Production
      - name: Package Production WAR
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B package -Pprod -DskipTests

      # Step 6: Upload the built WAR archive
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/*.war

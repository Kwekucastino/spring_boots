name: JHipster CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # -T 1C uses parallel threads to speed up downloads
      # --fail-fast stops the build immediately on network errors instead of waiting 20 minutes
      - name: Fast Build with Maven
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: |
          ./mvnw -B -T 1C clean package \
            -DskipTests \
            -Pprod \
            -Dhttp.keepAlive=false \
            -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.http.retryHandler.count=3

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-war
          path: target/*.war
